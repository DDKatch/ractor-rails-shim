name: CI

# CI for ractor-rails-shim. Three jobs:
#   - lint:       code style via Standard (standardrb, config in
#                 .standard.yml). Fast, always runs.
#   - unit:       runs the no-Rails unit specs (shim mechanism + version
#                 detection + callable/lock infra). Fast, always runs.
#   - integration: builds the minimal Rails 8.1 test app (via
#                 script/make_test_app.sh), boots it, makes it shareable, and
#                 dispatches GET /up in a worker Ractor — asserting HTTP 200.
#                 This is the "real Rails app in CI" coverage the fake-module
#                 specs can't provide.
#
# Ruby 4.0.6 is required (frozen-iseq call-cache fix #22075 + cross-ractor
# env-string fix both shipped in 4.0.6). The shim is tested against Rails
# 8.1.x; the matrix is a single entry today, with the version-detection
# infrastructure (PATCH_VERSIONS) ready to add 7.x rows once version-specific
# patches are written.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Code style (Standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby 4.0.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Run standardrb
        run: bundle exec rake lint

  unit:
    name: Unit specs (no Rails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby 4.0.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Run unit specs
        run: bundle exec rake spec

  integration:
    name: Integration (minimal Rails 8.1 app, worker Ractor dispatch)
    runs-on: ubuntu-latest
    env:
      RAILS_SHIM_TEST_APP: /tmp/rails-shim-test-app
      DATABASE_URL: postgresql://dev@127.0.0.1:5432
    # Since 4ec9a4c the job builds the REAL test app (cloned from
    # DDKatch/ractor-rails-shim-test-app), whose database.yml defaults to
    # PostgreSQL on 127.0.0.1 — make_test_app.sh's db:prepare only WARNs when
    # it is unreachable, so without a service container the app still boots
    # and then the worker Ractor's AR connection init dies with
    # ActiveRecord::DatabaseConnectionError ("issue connecting with your
    # hostname: 127.0.0.1"). Serve the DB the app expects: postgresql user
    # `dev` (passwordless via trust auth), same shape as the test app's own
    # CI workflow.
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby 4.0.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - name: Install Rails (for `rails new`)
        run: gem install rails -v "~> 8.1.3" --no-document

      - name: Build the test app
        run: ./script/make_test_app.sh "$RAILS_SHIM_TEST_APP"

      # make_test_app.sh runs db:prepare WITHOUT RAILS_ENV (development), and
      # only WARNS when the DB is unreachable. The spec + audit steps boot the
      # app in production, which resolves ractor_rails_shim_test_app_prod —
      # without this step CI dies with ActiveRecord::NoDatabaseError.
      - name: Prepare the production database
        working-directory: ${{ env.RAILS_SHIM_TEST_APP }}
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: bin/rails db:prepare

      - name: Run integration spec (GET /up → 200 in a worker Ractor)
        working-directory: ${{ env.RAILS_SHIM_TEST_APP }}
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: |
          bundle exec ruby -I${{ github.workspace }}/lib \
            -I${{ github.workspace }}/spec \
            -e 'require "minitest/autorun"; require "${{ github.workspace }}/spec/integration_spec.rb"'

      - name: Run ractor-rails-check audit on the test app
        working-directory: ${{ env.RAILS_SHIM_TEST_APP }}
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: |
          bundle exec ruby -I${{ github.workspace }}/lib \
            -e 'require "ractor_rails_shim"; require File.expand_path("config/boot"); require File.expand_path("config/application"); Bundler.require(*Rails.groups); Rails.application.initialize!; RactorRailsShim::Check.report(print: true)'
